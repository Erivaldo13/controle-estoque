<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Controle de Estoque ES</title>

<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  font-family: Arial, sans-serif;

  background: #f2f2f2;

}

.container {

  width: 100%;
  max-width: 500px;

  margin: auto;

}

h1 {

  text-align: center;

  font-size: 24px;

  margin-bottom: 20px;

}

.card {

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.15);

  margin-bottom: 15px;

}

label {

  display: block;

  font-weight: bold;

  margin-top: 12px;

  margin-bottom: 5px;

}

input,
select {

  width: 100%;

  padding: 13px;

  border: 1px solid #ccc;

  border-radius: 8px;

  font-size: 16px;

}

button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 8px;

  font-size: 16px;

  font-weight: bold;

  margin-top: 10px;

  cursor: pointer;

}

.btn-camera {

  background: #333;

  color: white;

}

.btn-fechar {

  background: #777;

  color: white;

  display: none;

}

.btn-consultar {

  background: #555;

  color: white;

}

.btn-registrar {

  background: #1976d2;

  color: white;

  font-size: 18px;

}

.produto {

  background: #f5f5f5;

  padding: 15px;

  border-radius: 8px;

  margin-top: 12px;

}

.estoque {

  font-size: 28px;

  font-weight: bold;

  text-align: center;

  margin: 15px 0;

}

#reader {

  width: 100%;

  margin-top: 15px;

  overflow: hidden;

  border-radius: 8px;

}

.status-camera {

  text-align: center;

  font-size: 14px;

  margin-top: 10px;

  color: #555;

}

.mensagem {

  padding: 12px;

  border-radius: 8px;

  margin-top: 15px;

  white-space: pre-line;

  background: #eef3f8;

  display: none;

}

.sucesso {

  background: #d9f2df;

  color: #155724;

}

.erro {

  background: #f8d7da;

  color: #721c24;

}

</style>

</head>


<body>

<div class="container">

<h1>📦 CONTROLE DE ESTOQUE</h1>


<div class="card">

<button
class="btn-camera"
type="button"
onclick="abrirCamera()">

📷 LER QR CODE

</button>


<button
id="btnFecharCamera"
class="btn-fechar"
type="button"
onclick="fecharCamera()">

✖ FECHAR CÂMERA

</button>


<div
id="statusCamera"
class="status-camera">
</div>


<div id="reader"></div>


<label>SKU</label>

<input
type="text"
id="sku"
placeholder="Digite ou leia o QR Code">


<button
class="btn-consultar"
type="button"
onclick="buscarProduto()">

🔎 CONSULTAR PRODUTO

</button>


<div
id="produto"
class="produto">

Produto não selecionado

</div>


<div
id="estoque"
class="estoque">

Estoque: -

</div>

</div>


<div class="card">

<label>Tipo de movimentação</label>

<select id="tipo">

<option value="">
Selecione
</option>

<option value="Entrada">
📥 ENTRADA
</option>

<option value="Saída">
📤 SAÍDA
</option>

</select>


<label>Quantidade</label>

<input
type="number"
id="quantidade"
min="1"
step="1"
placeholder="Digite a quantidade">


<label>Operador</label>

<input
type="text"
id="operador"
placeholder="Nome do operador">


<label>Observação</label>

<input
type="text"
id="observacao"
placeholder="Opcional">


<button
class="btn-registrar"
type="button"
onclick="registrar()">

✅ REGISTRAR MOVIMENTAÇÃO

</button>


<div
id="mensagem"
class="mensagem">
</div>

</div>


<div
style="
text-align:center;
font-size:12px;
color:#777;
margin-top:10px;
">

Controle de Estoque ES

</div>

</div>


<script>

/* ============================================================
   CONFIGURAÇÃO
============================================================ */

const API_URL =
'https://script.google.com/macros/s/AKfycbyr8totSfl37plsMrhtx6ubUVL3DzBM5hMovFWfoUhZAeNuaItDLoSWNqnUCAYYK5TSAw/exec';


let produtoAtual = null;

let scannerQR = null;

let processandoQR = false;


/* ============================================================
   JSONP
============================================================ */

function chamarAPI(acao, parametros = {}) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'callback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams();


    query.append('action', acao);

    query.append('callback', callbackName);


    Object.keys(parametros).forEach(function(chave) {

      query.append(
        chave,
        parametros[chave] ?? ''
      );

    });


    const timeout =
      setTimeout(function() {

        limpar();

        reject(
          new Error(
            'Tempo limite excedido ao comunicar com o servidor.'
          )
        );

      }, 15000);


    window[callbackName] =
      function(resultado) {

        clearTimeout(timeout);

        limpar();

        resolve(resultado);

      };


    function limpar() {

      try {

        delete window[callbackName];

      } catch(e) {}

      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }

    }


    script.onerror =
      function() {

        clearTimeout(timeout);

        limpar();

        reject(
          new Error(
            'Não foi possível conectar ao Apps Script.'
          )
        );

      };


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(script);

  });

}


/* ============================================================
   CÂMERA / QR CODE
============================================================ */

async function abrirCamera() {

  const reader =
    document.getElementById('reader');

  const status =
    document.getElementById('statusCamera');

  const btnFechar =
    document.getElementById('btnFecharCamera');


  if (!reader) {

    alert(
      'Área do leitor QR não encontrada.'
    );

    return;

  }


  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    alert(
      'Biblioteca do QR Code não carregada.'
    );

    return;

  }


  try {

    await fecharCamera(false);


    reader.innerHTML = '';

    status.innerText =
      'Solicitando acesso à câmera...';


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador não permite acesso à câmera. Verifique se o site está sendo aberto por HTTPS.'
      );

    }


    /* Solicita explicitamente a câmera */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          }

        },

        audio: false

      });


    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    status.innerText =
      'Câmera ativa. Aponte para o QR Code.';


    btnFechar.style.display =
      'block';


    scannerQR =
      new Html5Qrcode('reader');


    const config = {

      fps: 10,

      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const tamanho =
            Math.min(
              viewfinderWidth * 0.75,
              viewfinderHeight * 0.75,
              300
            );


          return {

            width:
              Math.floor(tamanho),

            height:
              Math.floor(tamanho)

          };

        }

    };


    await scannerQR.start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      config,


      async function(decodedText) {

        if (processandoQR)
          return;


        processandoQR = true;


        const sku =
          String(decodedText).trim();


        console.log(
          'QR CODE LIDO:',
          sku
        );


        document.getElementById(
          'sku'
        ).value = sku;


        status.innerText =
          'QR Code lido com sucesso.';


        await fecharCamera(false);


        await buscarProduto();


        setTimeout(function() {

          processandoQR = false;

        }, 1000);

      },


      function(errorMessage) {

        /* Erros normais durante a leitura
           são ignorados. */

      }

    );


  } catch(error) {

    console.error(
      'Erro câmera:',
      error
    );


    await fecharCamera(false);


    if (
      error.name ===
      'NotAllowedError'
    ) {

      alert(
        'O acesso à câmera foi negado.\n\n' +
        'Abra as configurações do navegador e permita o acesso à câmera para este site.'
      );


    } else if (
      error.name ===
      'NotFoundError'
    ) {

      alert(
        'Nenhuma câmera foi encontrada.'
      );


    } else {

      alert(
        'Não foi possível iniciar a câmera.\n\n' +
        error.message
      );

    }

  }

}


/* ============================================================
   FECHAR CÂMERA
============================================================ */

async function fecharCamera(
  mostrarStatus = true
) {

  const reader =
    document.getElementById(
      'reader'
    );


  const status =
    document.getElementById(
      'statusCamera'
    );


  const btnFechar =
    document.getElementById(
      'btnFecharCamera'
    );


  if (scannerQR) {

    try {

      await scannerQR.stop();

    } catch(e) {}


    try {

      scannerQR.clear();

    } catch(e) {}


    scannerQR = null;

  }


  if (reader) {

    reader.innerHTML = '';

  }


  if (btnFechar) {

    btnFechar.style.display =
      'none';

  }


  if (
    mostrarStatus &&
    status
  ) {

    status.innerText = '';

  }

}


/* ============================================================
   BUSCAR PRODUTO
============================================================ */

async function buscarProduto() {

  const campo =
    document.getElementById(
      'sku'
    );


  const sku =
    campo.value.trim();


  if (!sku) {

    mostrarMensagem(
      'Informe ou leia um SKU.',
      true
    );

    return;

  }


  mostrarMensagem(
    'Consultando produto...',
    false
  );


  try {

    const resultado =
      await chamarAPI(
        'buscarProduto',
        {
          sku: sku
        }
      );


    if (
      !resultado ||
      !resultado.sucesso
    ) {

      produtoAtual = null;


      document.getElementById(
        'produto'
      ).innerText =
        resultado?.mensagem ||
        'Produto não encontrado.';


      document.getElementById(
        'estoque'
      ).innerText =
        'Estoque: -';


      mostrarMensagem(
        resultado?.mensagem ||
        'Produto não encontrado.',
        true
      );


      return;

    }


    produtoAtual =
      resultado;


    document.getElementById(
      'produto'
    ).innerHTML =

      '<strong>SKU:</strong> ' +
      escaparHTML(resultado.sku) +

      '<br><br>' +

      '<strong>Produto:</strong> ' +
      escaparHTML(resultado.produto);


    await consultarEstoque(
      resultado.sku
    );


    esconderMensagem();


  } catch(error) {

    console.error(error);


    produtoAtual = null;


    mostrarMensagem(
      'Erro ao consultar produto:\n' +
      error.message,
      true
    );

  }

}


/* ============================================================
   CONSULTAR ESTOQUE
============================================================ */

async function consultarEstoque(
  sku
) {

  try {

    const resultado =
      await chamarAPI(
        'consultarEstoque',
        {
          sku: sku
        }
      );


    if (
      !resultado ||
      !resultado.sucesso
    ) {

      document.getElementById(
        'estoque'
      ).innerText =
        resultado?.mensagem ||
        'Erro ao consultar estoque.';


      return;

    }


    document.getElementById(
      'estoque'
    ).innerText =

      'Estoque: ' +

      Number(
        resultado.estoque
      ).toLocaleString(
        'pt-BR'
      );


  } catch(error) {

    document.getElementById(
      'estoque'
    ).innerText =
      'Erro ao consultar estoque.';


    console.error(error);

  }

}


/* ============================================================
   REGISTRAR MOVIMENTAÇÃO
============================================================ */

async function registrar() {

  if (!produtoAtual) {

    mostrarMensagem(
      'Primeiro leia ou informe um SKU válido.',
      true
    );

    return;

  }


  const tipo =
    document.getElementById(
      'tipo'
    ).value;


  const quantidade =
    Number(
      document.getElementById(
        'quantidade'
      ).value
    );


  const operador =
    document.getElementById(
      'operador'
    ).value.trim();


  const observacao =
    document.getElementById(
      'observacao'
    ).value.trim();


  const dispositivo =
    navigator.userAgent;


  if (!tipo) {

    mostrarMensagem(
      'Selecione ENTRADA ou SAÍDA.',
      true
    );

    return;

  }


  if (
    !quantidade ||
    quantidade <= 0
  ) {

    mostrarMensagem(
      'Informe uma quantidade válida.',
      true
    );

    return;

  }


  if (
    !Number.isInteger(
      quantidade
    )
  ) {

    mostrarMensagem(
      'A quantidade deve ser um número inteiro.',
      true
    );

    return;

  }


  if (!operador) {

    mostrarMensagem(
      'Informe o operador.',
      true
    );

    return;

  }


  mostrarMensagem(
    'Registrando movimentação...',
    false
  );


  try {

    const resultado =
      await chamarAPI(

        'registrarMovimentacao',

        {

          sku:
            produtoAtual.sku,

          tipo:
            tipo,

          quantidade:
            quantidade,

          operador:
            operador,

          dispositivo:
            dispositivo,

          observacao:
            observacao

        }

      );


    if (
      !resultado ||
      !resultado.sucesso
    ) {

      mostrarMensagem(
        resultado?.mensagem ||
        'Erro ao registrar movimentação.',
        true
      );

      return;

    }


    mostrarMensagem(

      'MOVIMENTAÇÃO REGISTRADA!\n\n' +

      'Produto: ' +
      resultado.produto +

      '\nSKU: ' +
      resultado.sku +

      '\nTipo: ' +
      resultado.tipo +

      '\nQuantidade: ' +
      resultado.quantidade +

      '\n\nEstoque atual: ' +
      resultado.estoqueNovo,

      false

    );


    document.getElementById(
      'quantidade'
    ).value = '';


    document.getElementById(
      'tipo'
    ).value = '';


    document.getElementById(
      'observacao'
    ).value = '';


    await consultarEstoque(
      resultado.sku
    );


  } catch(error) {

    mostrarMensagem(

      'Erro ao registrar movimentação:\n' +
      error.message,

      true

    );

  }

}


/* ============================================================
   MENSAGENS
============================================================ */

function mostrarMensagem(
  texto,
  erro
) {

  const elemento =
    document.getElementById(
      'mensagem'
    );


  elemento.style.display =
    'block';


  elemento.innerText =
    texto;


  elemento.className =
    'mensagem ' +
    (erro
      ? 'erro'
      : 'sucesso');

}


function esconderMensagem() {

  const elemento =
    document.getElementById(
      'mensagem'
    );


  elemento.style.display =
    'none';

}


/* ============================================================
   SEGURANÇA HTML
============================================================ */

function escaparHTML(valor) {

  return String(
    valor == null
      ? ''
      : valor
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

</script>

</body>

</html>
